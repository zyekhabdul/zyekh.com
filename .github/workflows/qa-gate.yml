name: QA Master Gate
run-name: 19-Axis Programmatic QA Gate Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Programmatic Quality Gate (Checks 1-19)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install beautifulsoup4 pillow

      - name: Execute QA Master Gate
        run: |
          python3 verify_batch.py
