      --bg-dark: #09090b;
      --bg-card: #141417;
      --border-color: #27272a;
      --border-color-hover: #52525b;
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    h1, h2, h3, h4 {
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
      margin-top: 0;
    }

    .header-nav {
      background-color: rgba(9, 9, 11, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0.75rem 1.5rem;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      font-family: 'Fira Code', monospace;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
      font-size: 1.1rem;
      letter-spacing: -0.05em;
    }

    .pure-menu-link {
      color: var(--text-muted) !important;
      font-weight: 500;
      transition: color 0.2s ease;
    }
    .pure-menu-link:hover, .pure-menu-link:focus {
      color: var(--text-main) !important;
      background: transparent !important;
    }

    .main-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    .tool-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 2rem;
      border-radius: 8px;
    }

    input[type="text"], input[type="number"], input[type="email"], input[type="password"], input[type="datetime-local"], select, textarea {
      background: #09090b !important;
      border: 1px solid var(--border-color) !important;
      color: #fff !important;
      padding: 0.6rem 0.9rem !important;
      border-radius: 6px !important;
      font-size: 0.95rem;
      width: 100%;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, sans-serif;
      margin-bottom: 0.8rem;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--border-color-hover) !important;
      outline: none;
    }
    label {
      color: var(--text-muted);
      font-size: 0.88rem;
      display: block;
      margin-bottom: 0.4rem;
    }

    button, .pure-button {
      background-color: #fafafa !important;
      color: #09090b !important;
      font-weight: 600;
      border-radius: 6px;
      padding: 0.55rem 1.2rem;
      border: 1px solid #ffffff !important;
      cursor: pointer;
      font-family: 'Inter', system-ui, sans-serif;
      margin-right: 0.4rem;
      margin-bottom: 0.4rem;
      transition: background-color 0.2s ease;
    }
    button:hover, .pure-button:hover {

    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      background: #09090b;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    th, td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
    }
    th {
      background: #141417;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.88rem;
    }
    td {
      color: var(--text-main);
    }

    a {
      color: var(--text-main);
      text-decoration: underline;
    }

    .footer {
      padding: 2.5rem 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      border-top: 1px solid var(--border-color);
    }
  </style>
</head>
<body>
  <header class="header-nav">
    <div class="nav-container">
      <a href="/" class="brand-logo">ZYEKH_ABDUL</a>
      <div class="pure-menu pure-menu-horizontal">
        <ul class="pure-menu-list">
          <li class="pure-menu-item"><a href="/" class="pure-menu-link">Project Home</a></li>
          <li class="pure-menu-item"><a href="/tools/" class="pure-menu-link" style="color: #ffffff !important; font-weight:600;">🧰 All Tools (19)</a></li>
        </ul>
      </div>
    </div>
  </header>

  <main class="main-container">
    <div style="margin-bottom: 1.5rem;">
      <a href="/tools/" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">← Back to Tools Hub</a>
    </div>
    
    <div class="tool-box">
      <h1>Countdown Timer</h1>
  <p>
    <label for="target">Target tanggal &amp; waktu</label><br>
    <input type="datetime-local" id="target" oninput="update()">
  </p>
  <p id="display">Pilih tanggal di atas</p>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 <strong>zyekh.com</strong> — Tools Hub. All tools run client-side locally in browser.</p>
  </footer>

  <script>
    let timer;

    function parseHash() {
      const raw = location.hash.slice(1);
      if (!raw) return null;
      const d = new Date(decodeURIComponent(raw));
      return isNaN(d) ? null : d;
    }

    function pad(n) { return String(n).padStart(2, '0'); }

    function update() {
      clearInterval(timer);
      const input = document.getElementById('target');
      const display = document.getElementById('display');
      const val = input.value;
      if (!val) {
        display.textContent = 'Pilih tanggal di atas';
        history.replaceState(null, '', location.pathname);
        return;
      }
      const target = new Date(val);
      history.replaceState(null, '', location.pathname + '#' + encodeURIComponent(target.toISOString()));

      function tick() {
        const diff = target - Date.now();
        if (diff <= 0) {
          display.textContent = 'Waktu habis!';
          clearInterval(timer);
          return;
        }
        const s = Math.floor(diff / 1000);
        const days = Math.floor(s / 86400);
        const hrs = Math.floor((s % 86400) / 3600);
        const mins = Math.floor((s % 3600) / 60);
        const secs = s % 60;
        const parts = [];
        if (days) parts.push(days + ' hari');
        parts.push(pad(hrs) + ' jam');
        parts.push(pad(mins) + ' menit');
        parts.push(pad(secs) + ' detik');
        display.textContent = parts.join(' ');
      }

      tick();
      timer = setInterval(tick, 1000);
    }

    const fromHash = parseHash();
    if (fromHash) {
      const local = new Date(fromHash.getTime() - fromHash.getTimezoneOffset() * 60000);
      document.getElementById('target').value = local.toISOString().slice(0, 16);
    }
    update();
  </script>
</body>
