  <script>
    const SENTENCES = [
      'Indonesia adalah negara kepulauan dengan kekayaan budaya yang luar biasa.',
      'Nasi goreng dan rendang telah dikenal luas sebagai kuliner khas Nusantara.',
      'Jakarta, Surabaya, dan Bandung merupakan kota metropolitan yang terus berkembang.',
      'Pantai Bali dan Raja Ampat menawarkan pemandangan alam yang memukau.',
      'Gotong royong dan musyawarah mufakat menjadi nilai penting dalam masyarakat Indonesia.',
      'Bahasa Indonesia mempersatukan ratusan suku bangsa di seluruh nusantara.',
      'Wayang kulit dan batik merupakan warisan budaya yang diakui UNESCO.',
      'Padi, jagung, dan kelapa sawit menjadi komoditas pertanian utama.',
      'Transportasi online dan e-commerce semakin populer di perkotaan.',
      'Cuaca tropis dengan musim hujan dan kemarau bergantian sepanjang tahun.',
      'Sepak bola dan badminton adalah olahraga favorit masyarakat Indonesia.',
      'Upacara adat dan festival daerah masih lestari di berbagai provinsi.',
      'Teknologi digital membuka peluang baru bagi UMKM lokal.',
      'Keramahan penduduk lokal sering menjadi alasan wisatawan kembali berkunjung.',
      'Gunung Bromo dan Danau Toba menjadi destinasi wisata alam unggulan.'
    ];

    function randomInt(max) {
      const arr = new Uint32Array(1);
      crypto.getRandomValues(arr);
      return arr[0] % max;
    }

    function pickSentence(used) {
      let s, tries = 0;
      do {
        s = SENTENCES[randomInt(SENTENCES.length)];
        tries++;
      } while (used.has(s) && tries < 20);
      used.add(s);
      return s;
    }

    function generate() {
      const n = Math.max(1, Math.min(20, +document.getElementById('paras').value || 3));
      const paras = [];
      for (let p = 0; p < n; p++) {
        const used = new Set();
        const count = 3 + randomInt(3);
        const sents = [];
        for (let i = 0; i < count; i++) sents.push(pickSentence(used));
        paras.push(sents.join(' '));
      }
      document.getElementById('out').value = paras.join('\n\n');
    }

    function copy() {
      const out = document.getElementById('out');
      if (out.value) navigator.clipboard.writeText(out.value);
    }

    generate();
  </script>
