    <label><input type="checkbox" id="digits" checked onchange="generate()"> Angka (0-9)</label><br>
    <label><input type="checkbox" id="symbols" checked onchange="generate()"> Simbol (!@#$…)</label>

  <script>
    const POOLS = {
      lower: 'abcdefghijklmnopqrstuvwxyz',
      upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      digits: '0123456789',
      symbols: '!@#$%^&*()-_=+[]{}|;:,.<>?'
    };

    function randomInt(max) {
      const arr = new Uint32Array(1);
      crypto.getRandomValues(arr);
      return arr[0] % max;
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = randomInt(i + 1);
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function generate() {
      const len = +document.getElementById('len').value;
      const active = [];
      for (const [key, pool] of Object.entries(POOLS)) {
        if (document.getElementById(key).checked) active.push(pool);
      }
      if (!active.length) {
        document.getElementById('output').textContent = 'Pilih minimal satu jenis karakter.';
        return;
      }
      const all = active.join('');
      const chars = [];
      for (const pool of active) chars.push(pool[randomInt(pool.length)]);
      while (chars.length < len) chars.push(all[randomInt(all.length)]);
      document.getElementById('output').textContent = shuffle(chars).join('');
    }

    function copy() {
      const text = document.getElementById('output').textContent;
      if (!text || text.startsWith('Pilih')) return;
      navigator.clipboard.writeText(text);
    }

    generate();
  </script>
