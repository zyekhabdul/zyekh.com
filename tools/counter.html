    /* Header & Navigation */
    .header-nav {
      background-color: rgba(9, 9, 11, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 0.75rem 1.5rem;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;

      justify-content: space-between;

    .brand-logo {

    .nav-menu {

    .nav-list {

<body>
  <!-- Header Navigation -->
  <header class="header-nav">

  <main class="main-container">
    <div style="margin-bottom: 1.5rem;">
      <a href="/tools/" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">← Back to Tools Hub</a>
    </div>
    
    <div class="tool-box">
      <h1>Word &amp; Character Counter</h1>
  <p><textarea id="in" rows="10" cols="50" placeholder="Tempel atau ketik teks di sini…" oninput="update()"></textarea></p>
  <table border="1">
    <tr><th>Kata</th><td id="words">0</td></tr>
    <tr><th>Karakter (dengan spasi)</th><td id="chars">0</td></tr>
    <tr><th>Karakter (tanpa spasi)</th><td id="charsNoSpace">0</td></tr>
    <tr><th>Baris</th><td id="lines">0</td></tr>
    <tr><th>Estimasi waktu baca</th><td id="readTime">—</td></tr>
  </table>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 <strong>zyekh.com</strong> — Tools Hub. All tools run client-side locally in browser.</p>
  </footer>

  <script>
    const WPM = 200;

    function update() {
      const text = document.getElementById('in').value;
      const trimmed = text.trim();
      const words = trimmed ? trimmed.split(/\s+/).length : 0;
      const mins = words / WPM;
      let readTime = '—';
      if (words > 0) {
        if (mins < 1) readTime = '< 1 menit';
        else if (mins < 60) readTime = Math.ceil(mins) + ' menit';
        else readTime = Math.floor(mins / 60) + ' jam ' + Math.ceil(mins % 60) + ' menit';
      }

      document.getElementById('words').textContent = words;
      document.getElementById('chars').textContent = text.length;
      document.getElementById('charsNoSpace').textContent = text.replace(/\s/g, '').length;
      document.getElementById('lines').textContent = text ? text.split('\n').length : 0;
      document.getElementById('readTime').textContent = readTime;
    }
    update();
  </script>
</body>
