<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-icon-180x180.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/grids-responsive-min.css">
  
  <!-- Google Fonts: Outfit & Inter & Fira Code -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg-dark: #09090b;
      --bg-card: #141417;
      --border-color: #27272a;
      --border-color-hover: #52525b;
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    h1, h2, h3, h4 {
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
      margin-top: 0;
    }

    .header-nav {
      background-color: rgba(9, 9, 11, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0.75rem 1.5rem;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      font-family: 'Fira Code', monospace;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
      font-size: 1.1rem;
      letter-spacing: -0.05em;
    }

    .pure-menu-link {
      color: var(--text-muted) !important;
      font-weight: 500;
      transition: color 0.2s ease;
    }
    .pure-menu-link:hover, .pure-menu-link:focus {
      color: var(--text-main) !important;
      background: transparent !important;
    }

    .main-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    .tool-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 2rem;
      border-radius: 8px;
    }

    input[type="text"], input[type="number"], input[type="email"], input[type="password"], input[type="datetime-local"], select, textarea {
      background: #09090b !important;
      border: 1px solid var(--border-color) !important;
      color: #fff !important;
      padding: 0.6rem 0.9rem !important;
      border-radius: 6px !important;
      font-size: 0.95rem;
      width: 100%;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, sans-serif;
      margin-bottom: 0.8rem;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--border-color-hover) !important;
      outline: none;
    }
    label {
      color: var(--text-muted);
      font-size: 0.88rem;
      display: block;
      margin-bottom: 0.4rem;
    }

    button, .pure-button {
      background-color: #fafafa !important;
      color: #09090b !important;
      font-weight: 600;
      border-radius: 6px;
      padding: 0.55rem 1.2rem;
      border: 1px solid #ffffff !important;
      cursor: pointer;
      font-family: 'Inter', system-ui, sans-serif;
      margin-right: 0.4rem;
      margin-bottom: 0.4rem;
      transition: background-color 0.2s ease;
    }
    button:hover, .pure-button:hover {
      background-color: #e4e4e7 !important;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      background: #09090b;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    th, td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
    }
    th {
      background: #141417;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.88rem;
    }
    td {
      color: var(--text-main);
    }

    a {
      color: var(--text-main);
      text-decoration: underline;
    }

    .footer {
      padding: 2.5rem 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      border-top: 1px solid var(--border-color);
    }
  </style>

<body>
  <header class="header-nav">
    <div class="nav-container">
      <a href="/" class="brand-logo">ZYEKH_ABDUL</a>
      <div class="pure-menu pure-menu-horizontal">
        <ul class="pure-menu-list">
          <li class="pure-menu-item"><a href="/" class="pure-menu-link">Project Home</a></li>
          <li class="pure-menu-item"><a href="/tools/" class="pure-menu-link" style="color: #ffffff !important; font-weight:600;">🧰 All Tools (19)</a></li>
        </ul>
      </div>
    </div>
  </header>

  <main class="main-container">
    <div style="margin-bottom: 1.5rem;">
      <a href="/tools/" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">← Back to Tools Hub</a>
    </div>
    
    <div class="tool-box">
      <h1>Text to Speech</h1>
  <p>
    <label for="text">Teks</label><br>
    <textarea id="text" rows="8" cols="60" placeholder="Ketik teks yang ingin dibacakan…" oninput="save()"></textarea>
  </p>
  <p>
    <label for="rate">Kecepatan: <output id="rateVal">1</output></label><br>
    <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1"
      oninput="rateVal.value=this.value">
  </p>
  <p>
    <label for="voice">Suara</label><br>
    <select id="voice"></select>
  </p>
  <p>
    <button type="button" onclick="speak()">Baca</button>
    <button type="button" onclick="stop()">Stop</button>
  </p>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 <strong>zyekh.com</strong> — Tools Hub. All tools run client-side locally in browser.</p>
  </footer>

  <script>
    const textEl = document.getElementById('text');
    const voiceEl = document.getElementById('voice');
    let voices = [];

    function loadVoices() {
      voices = speechSynthesis.getVoices();
      voiceEl.innerHTML = '';
      const idVoices = voices.filter(v => v.lang.startsWith('id'));
      const list = idVoices.length ? idVoices : voices;
      list.forEach((v, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = v.name + ' (' + v.lang + ')';
        voiceEl.appendChild(opt);
      });
    }

    speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    function speak() {
      stop();
      const t = textEl.value.trim();
      if (!t) return;
      const u = new SpeechSynthesisUtterance(t);
      u.rate = +document.getElementById('rate').value;
      const idVoices = voices.filter(v => v.lang.startsWith('id'));
      const list = idVoices.length ? idVoices : voices;
      u.voice = list[+voiceEl.value] || list[0];
      speechSynthesis.speak(u);
    }

    function stop() { speechSynthesis.cancel(); }

    function save() {
      const val = textEl.value;
      if (val) history.replaceState(null, '', location.pathname + '#' + encodeURIComponent(val));
      else history.replaceState(null, '', location.pathname);
    }

    if (location.hash) textEl.value = decodeURIComponent(location.hash.slice(1));
  </script>
</body>
</html>
