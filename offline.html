<!DOCTYPE html>
<html lang="id-ID">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#09090b">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anda sedang Offline 📶 | zyekh.com</title>
  <meta name="description" content="Koneksi internet Anda terputus.">
  
  <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css">
  
  <link rel="preconnect" href="/">
  <link rel="preload" href="/assets/fonts/inter-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/outfit-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/fonts/fonts.css">

  <style>
    :root {
      --bg-dark: #09090b;
      --bg-card: #141417;
      --border-color: #27272a;
      --border-color-hover: #52525b;
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
      --accent: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    h1, h2, h3, h4 {
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
    }

    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
      max-width: 600px;
      margin: 0 auto;
    }

    .icon-offline {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    .title {
      font-size: 2.5rem;
      margin: 0 0 1rem 0;
    }

    .desc {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.2s ease;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn:hover {
      border-color: var(--border-color-hover);
      background: #1a1a1e;
    }
  
    /* Global Mobile & Overflow Safeguards */
    *, *::before, *::after { box-sizing: border-box; }
    html { max-width: 100vw; overflow-x: hidden; }
html {
      scroll-behavior: smooth;
    }
    section[id] {
      scroll-margin-top: 80px;
    }
    body { max-width: 100vw; overflow-x: hidden; position: relative; }
    img, svg, video, canvas { max-width: 100%; height: auto; }
    pre, code { max-width: 100%; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
    table { width: 100%; border-collapse: collapse; }
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 1.5rem;
      border-radius: 6px;
    }
    input, select, textarea, button { max-width: 100%; }

    @media (max-width: 768px) {
      .main-container { padding: 1.25rem 1rem !important; }
      .pure-g { flex-direction: column; }
      .pure-u-1, [class*="pure-u-"] { width: 100% !important; margin-left: 0 !important; margin-right: 0 !important; }
      h1, .hero-title { font-size: 1.65rem !important; line-height: 1.25 !important; word-break: break-word; }
      h2, .section-title { font-size: 1.35rem !important; }
      p, .hero-desc { font-size: 0.95rem !important; }
      .terminal-window { margin: 1rem 0 !important; }
      .terminal-input { font-size: 0.85rem !important; }
      .card, .custom-card, .tool-item { padding: 1rem !important; }
    }
  </style>

  <!-- Structured Data JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Offline - zyekh.com",
    "description": "Koneksi internet Anda terputus."
  }
  </script>
</head>
<body>

  <main class="main-container">
    <div class="icon-offline">📶</div>
    <h1 class="title">Anda sedang Offline</h1>
    <p class="desc">
      Koneksi internet Anda sepertinya terputus. Tenang saja! Tools di zyekh.com menggunakan teknologi client-side. Beberapa tool yang pernah Anda buka mungkin masih tetap bisa berjalan tanpa internet.
    </p>
    <div class="btn-group">
      <a href="/" class="btn">Kembali ke Home</a>
      <a href="/tools/" class="btn">Buka Tools Hub</a>
    </div>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
</html>
