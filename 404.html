      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-xl);
      gap: var(--space-md);
    }
    .error-code {
      font-family: 'Outfit', sans-serif;

    .error-actions {

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1.4rem;
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.95rem;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1.4rem;
      background: var(--bg-card);

      text-decoration: none;
      font-size: 0.95rem;
